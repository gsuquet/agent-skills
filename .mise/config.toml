[tools]
jq = '1.8.1'
pre-commit = '4.7.0'
shellcheck = '0.11.0'
shfmt = '3.14.1'
typos = '1.51.1'

[tasks.marketplace]
description = "Generate the Claude Code plugin manifests from skills/"
run = "scripts/marketplace.sh"

[tasks.bump]
description = "Raise a skill's version from its commits: mise run bump -- <skill> [--dry-run]"
run = "scripts/bump.sh"

[tasks.lint]
description = "Run every check (the Lint workflow runs the same task)"
run = [
  "find install.sh scripts skills -name '*.sh' -exec shellcheck {} +",
  "find install.sh scripts skills -name '*.sh' -exec shfmt --diff {} +",
  "typos",
  "scripts/check-skills.sh",
  "scripts/marketplace.sh --check",
  # The claude CLI is not installed in CI.
  "if command -v claude > /dev/null; then claude plugin validate .; fi",
]
